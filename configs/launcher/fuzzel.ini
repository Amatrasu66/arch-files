# ~/.config/fuzzel/fuzzel.ini - Catppuccin Mocha Application Launcher for Niri
# Phase 9.2: Dedicated Application Launcher

[main]
font=Inter Variable:size=12,JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt="Apps  ❯ "
placeholder="Search applications..."
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,exec
match-mode=fzf
terminal=kitty -e
lines=9
width=38
tabs=4
horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=28
image-size-ratio=0.5
anchor=center
layer=overlay
output=HDMI-A-1

[colors]
# Catppuccin Mocha Palette
# Background: #1e1e2e
background=1e1e2eff
# Text: #cdd6f4
text=cdd6f4ff
# Prompt & Border: Mauve #cba6f7
prompt=cba6f7ff
# Placeholder / Overlay: #6c7086
placeholder=6c7086ff
# Input text: #cdd6f4
input=cdd6f4ff
# Match text: Mauve #cba6f7
match=cba6f7ff
# Selection background: Surface #313244
selection=313244ff
# Selection text: #cdd6f4
selection-text=cdd6f4ff
# Selection match highlight: Mauve #cba6f7
selection-match=cba6f7ff
# Match counter: Subtext #a6adc8
counter=a6adc8ff
# Border: Mauve #cba6f7
border=cba6f7ff

[border]
width=2
radius=14
selection-radius=8

[dmenu]
exit-immediately-if-empty=no
