# ~/.config/swaylock/config
# Catppuccin Mocha themed secure lock screen for Niri / Wayland

# Detach from terminal after locking
daemonize

# Security & verification
ignore-empty-password
show-failed-attempts
show-keyboard-layout

# Indicator sizing
indicator-radius=90
indicator-thickness=9

# Background & fallback color
color=1e1e2e
image=~/.config/backgrounds/wallpaper.jpg
scaling=fill

# Catppuccin Mocha Palette Indicator Rings
inside-color=1e1e2e80
inside-clear-color=a6e3a180
inside-caps-lock-color=f9e2af80
inside-ver-color=89b4fa80
inside-wrong-color=f38ba880

ring-color=b4befeff
ring-clear-color=a6e3a1ff
ring-caps-lock-color=f9e2afff
ring-ver-color=89b4faff
ring-wrong-color=f38ba8ff

line-uses-inside

key-hl-color=cba6f7ff
bs-hl-color=f38ba8ff
caps-lock-key-hl-color=f9e2afff
caps-lock-bs-hl-color=f38ba8ff

separator-color=00000000

text-color=cdd6f4ff
text-clear-color=1e1e2eff
text-caps-lock-color=1e1e2eff
text-ver-color=1e1e2eff
text-wrong-color=1e1e2eff
