# ~/.config/kitty/kitty.conf - Catppuccin Mocha Glassmorphic Terminal
# Note: Kitty is the ONLY component permitted to use glassmorphism.

# --- Shell ---
shell /usr/bin/zsh
shell_integration enabled no-cursor

# --- Fonts ---
font_family      Adwaita Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Window & Glassmorphism ---
background_opacity 0.82
background_blur    1
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no

# --- Cursor & Animated Trail ---
cursor            #f5e0dc
cursor_text_color #1e1e2e
cursor_shape      block
cursor_blink_interval 0.6
cursor_trail      3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #89b4fa

# --- Scrollback ---
scrollback_lines 10000

# --- Catppuccin Mocha Palette ---
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #585b70

# URL underline color when hovering with mouse
url_color #f5e0dc

# Kitty window border colors
active_border_color   #b4befe
inactive_border_color #6c7086
bell_border_color     #f9e2af

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8
