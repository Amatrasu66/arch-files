name: Configuration & Syntax Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  portable-validation:
    name: Portable Repository Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Portable Validation Suite
        run: |
          bash -x scripts/validate.sh

  arch-validation:
    name: Target Environment Validation (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Target Validation Dependencies
        run: |
          pacman -Syu --noconfirm --needed bash python niri systemd swaybg swayidle wl-clipboard

      - name: Run Arch Target-Environment Validation
        run: |
          bash -x scripts/validate-arch.sh
