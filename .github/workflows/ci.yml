name: Configuration & Syntax Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  portable-validation:
    name: Portable Repository Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Portable Validation Suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -c "
          import subprocess
          res = subprocess.run(['bash', 'scripts/validate.sh'], capture_output=True, text=True)
          with open(r'$GITHUB_STEP_SUMMARY', 'w') as f:
              f.write('### Portable Validation Output\n```\n' + res.stdout + '\n' + res.stderr + '\n```')
          print(res.stdout)
          if res.stderr:
              print(res.stderr)
          exit(res.returncode)
          "

  arch-validation:
    name: Target Environment Validation (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Target Validation Dependencies
        run: |
          pacman -Syu --noconfirm --needed bash python niri systemd swaybg swayidle wl-clipboard

      - name: Run Arch Target-Environment Validation
        run: |
          python3 -c "
          import subprocess
          res = subprocess.run(['bash', 'scripts/validate-arch.sh'], capture_output=True, text=True)
          with open(r'$GITHUB_STEP_SUMMARY', 'w') as f:
              f.write('### Arch Validation Output\n```\n' + res.stdout + '\n' + res.stderr + '\n```')
          print(res.stdout)
          if res.stderr:
              print(res.stderr)
          exit(res.returncode)
          "
