name: Configuration & Syntax Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  portable-validation:
    name: Portable Repository Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Portable Validation Suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          bash scripts/validate.sh > /tmp/v.log 2>&1
          RC=$?
          set -e
          cat /tmp/v.log
          if [ $RC -ne 0 ]; then
            py_err=$(python3 -m py_compile upstream/modesty/additions/scripts/sync_shortcuts.py 2>&1 || true)
            echo "::error title=PyCompile Error::$py_err"
            first_err=$(grep -m 1 -E "\[ERROR\]|error:" /tmp/v.log || echo "Unknown validation error")
            echo "::error title=Validation Failure::$first_err"
            exit $RC
          fi

  arch-validation:
    name: Target Environment Validation (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Target Validation Dependencies
        run: |
          pacman -Syu --noconfirm --needed bash python niri systemd swaybg swayidle wl-clipboard

      - name: Run Arch Target-Environment Validation
        run: |
          bash scripts/validate-arch.sh
